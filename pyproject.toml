[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot"
version = "0.2.0"
description = "Multi-tenant Gemini chatbot with RAG and admin dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "google-genai>=1.0.0",
    "sqlalchemy>=2.0.36",
    "pymysql>=1.1.0",
    "cryptography>=42.0.0",
    "alembic>=1.14.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
    "python-docx>=1.1.0",
    "pypdf>=5.0.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "lancedb>=0.14.0",
    "numpy>=1.26.0",
    "rapidfuzz>=3.0.0",
    "markdown>=3.7.0",
    "markdownify>=0.14.0",
    "bleach>=6.2.0",
    "tinycss2>=1.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
chatbot = "chatbot.__main__:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not integration'"
markers = [
    "integration: live integration tests that call external APIs (skip by default)",
]
