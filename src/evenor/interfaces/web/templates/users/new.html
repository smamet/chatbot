{% extends "base.html" %}
{% block body %}
<div class="page-header">
  <h1>New user</h1>
</div>
<div class="card">
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/dashboard/users/new">
    <label>Email <input type="email" name="email" value="{{ email or '' }}" required></label>
    <label>Password <input type="password" name="password" required></label>
    <label>Role
      <select name="role">
        {% for r in roles %}
        <option value="{{ r.value }}">{{ r.value }}</option>
        {% endfor %}
      </select>
    </label>
    <div class="form-actions">
      <button type="submit" class="btn-primary" data-loading="Creating…">Create user</button>
    </div>
  </form>
</div>
<a href="/dashboard/users" class="back-link">← Back to users</a>
{% endblock %}
